<svg xmlns="http://www.w3.org/2000/svg" id="fig-3" viewBox="0 0 720 340" role="img"
     aria-label="Three attempts to save the same fact from service.yaml. The first copies the quote from the file and becomes row s01. The second retypes the quote, and the third recalls another number: both are refused." width="720" height="340">
  <style data-tokens="1">
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --border: #e2e5ec;
  --text: #161920;
  --text-dim: #5f6675;
  --muted: #5b6471;
  --accent: #2f5fd0;
  --accent-fg: #ffffff;
  --ok: #3f7d5c;
  --warn: #a9791b;
  --error: #b4483c;
  --info: #2f5fd0;
  --font-body: "Space Grotesk", "Avenir Next", "Segoe UI", ui-sans-serif, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ok-zone: color-mix(in srgb, var(--ok) 12%, var(--surface));
  --ok-line: color-mix(in srgb, var(--ok) 42%, var(--surface));
  --ok-ink: color-mix(in srgb, var(--ok) 38%, var(--text));
  --error-zone: color-mix(in srgb, var(--error) 12%, var(--surface));
  --error-line: color-mix(in srgb, var(--error) 42%, var(--surface));
  --error-ink: color-mix(in srgb, var(--error) 38%, var(--text));
  --warn-zone: color-mix(in srgb, var(--warn) 12%, var(--surface));
  --warn-line: color-mix(in srgb, var(--warn) 42%, var(--surface));
  --warn-ink: color-mix(in srgb, var(--warn) 38%, var(--text));
  --muted-zone: color-mix(in srgb, var(--muted) 12%, var(--surface));
  --muted-line: color-mix(in srgb, var(--muted) 42%, var(--surface));
  --muted-ink: color-mix(in srgb, var(--muted) 38%, var(--text));
  --info-zone: color-mix(in srgb, var(--info) 12%, var(--surface));
  --info-line: color-mix(in srgb, var(--info) 42%, var(--surface));
  --info-ink: color-mix(in srgb, var(--info) 38%, var(--text));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116;
    --surface: #161920;
    --border: #2a2f3a;
    --text: #f7f8fa;
    --text-dim: #9aa2b1;
    --muted: #8b949e;
    --accent: #5b8def;
    --accent-fg: #0e1116;
    --ok: #5b9d78;
    --warn: #c99a3a;
    --error: #d0685b;
    --info: #5b8def;
  }
}
:root { background: var(--surface); font-family: var(--font-body); }
text { fill: var(--text); }
</style>
  <!-- edges: attempt1.R → row.L | attempt2.R → refused2.L | attempt3.R → refused3.L -->
  <defs>
    <style>
      #fig-3 .mono   { font-family: var(--font-mono); font-size: 12px; }
      #fig-3 .t      { font-size: 12px; font-weight: 700; }
      #fig-3 .s      { font-size: 12px; fill: var(--text-dim); }
      #fig-3 .mid    { text-anchor: middle; }
      #fig-3 .end    { text-anchor: end; }
      #fig-3 .card   { fill: var(--bg); stroke: var(--border); }
      #fig-3 .left   { fill: var(--muted); fill-opacity: 0.10; stroke: var(--muted-line); }
      #fig-3 .right  { fill: var(--ok); fill-opacity: 0.10; stroke: var(--ok-line); }
      #fig-3 .wall   { fill: var(--text-dim); }
      #fig-3 .ok-z   { fill: var(--bg); stroke: var(--ok-line); }
      #fig-3 .err-z  { fill: var(--error-zone); stroke: var(--error-line); }
      #fig-3 .ok-i   { fill: var(--ok-ink); }
      #fig-3 .err-i  { fill: var(--error-ink); }
    </style>
    <marker id="fig-3-ok" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--ok)"/>
    </marker>
    <marker id="fig-3-bad" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--error)"/>
    </marker>
  </defs>

  <!-- decoration first: the two zones and the wall between them, with a gap for the row that passes -->
  <rect class="left"  x="24"  y="44" width="396" height="272" rx="8"/>
  <rect class="right" x="432" y="44" width="264" height="272" rx="8"/>
  <rect class="wall" x="420" y="44"  width="12" height="40"/>
  <rect class="wall" x="420" y="140" width="12" height="176"/>
  <text class="t mid" x="426" y="32">the script</text>

  <text class="t" x="36" y="68">Three attempts</text>
  <text class="mono end" x="408" y="68">service.yaml</text>
  <text class="mono t" x="444" y="68">ledger.jsonl</text>

  <!-- first attempt: copies the quote, passes the wall, becomes the row -->
  <g transform="translate(36,84)">
    <rect class="card" data-name="attempt1" width="244" height="56" rx="8"/>
    <text x="14" y="22"><tspan class="s">first</tspan><tspan x="14" dy="20">copies the quote from the file</tspan></text>
  </g>
  <line x1="280" y1="112" x2="477" y2="112" style="stroke:var(--ok)" stroke-width="1.5" marker-end="url(#fig-3-ok)"/>
  <text class="s mid" x="350" y="104">becomes</text>
  <g transform="translate(480,84)">
    <rect class="ok-z" data-name="row" width="168" height="56" rx="8"/>
    <path d="M16 28 l4 5 7-9" fill="none" style="stroke:var(--ok)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="mono t ok-i" x="40" y="33">row s01</text>
  </g>

  <!-- second attempt: retypes the quote, stopped at the wall -->
  <g transform="translate(36,164)">
    <rect class="card" data-name="attempt2" width="244" height="56" rx="8"/>
    <text x="14" y="22"><tspan class="s">second</tspan><tspan x="14" dy="20">retypes the quote</tspan></text>
  </g>
  <line x1="280" y1="192" x2="309" y2="192" style="stroke:var(--error)" stroke-width="1.5" marker-end="url(#fig-3-bad)"/>
  <g transform="translate(312,178)">
    <rect class="err-z" data-name="refused2" width="96" height="28" rx="14"/>
    <path d="M13 9 l8 8 m0 -8 l-8 8" fill="none" style="stroke:var(--error)" stroke-width="2.4" stroke-linecap="round"/>
    <text class="t err-i" x="30" y="19">refused</text>
  </g>

  <!-- third attempt: recalls another number, stopped at the wall -->
  <g transform="translate(36,244)">
    <rect class="card" data-name="attempt3" width="244" height="56" rx="8"/>
    <text x="14" y="22"><tspan class="s">third</tspan><tspan x="14" dy="20">recalls another number</tspan></text>
  </g>
  <line x1="280" y1="272" x2="309" y2="272" style="stroke:var(--error)" stroke-width="1.5" marker-end="url(#fig-3-bad)"/>
  <g transform="translate(312,258)">
    <rect class="err-z" data-name="refused3" width="96" height="28" rx="14"/>
    <path d="M13 9 l8 8 m0 -8 l-8 8" fill="none" style="stroke:var(--error)" stroke-width="2.4" stroke-linecap="round"/>
    <text class="t err-i" x="30" y="19">refused</text>
  </g>
</svg>
